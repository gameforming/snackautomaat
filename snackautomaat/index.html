<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Snackautomaat</title>

    <!-- CSS uit dezelfde map -->
    <link rel="stylesheet" href="./style.css">

    <!-- PWA manifest uit dezelfde map -->
    <link rel="manifest" href="./manifest.json">

    <!-- PWA instellingen -->
    <meta name="theme-color" content="#18202a">

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Snackautomaat"
    >
</head>

<body>

    <header class="app-header">
        <div>
            <h1>🍫 Snackautomaat</h1>
            <p>Houdbaarheidsoverzicht</p>
        </div>
    </header>


    <main>

        <!-- Overzicht -->
        <section class="overview-section">

            <h2>Overzicht</h2>

            <div
                id="statusOverview"
                class="status-overview"
            ></div>

        </section>


        <!-- Automaat -->
        <section class="machine-section">

            <div class="section-header">

                <div>
                    <h2>Snackautomaat</h2>

                    <p>
                        Klik op een vak voor de producten.
                    </p>
                </div>

                <button
                    id="addSlotButton"
                    class="primary-button"
                    type="button"
                >
                    ＋ Vak toevoegen
                </button>

            </div>


            <div
                id="slotsContainer"
                class="slots-container"
            ></div>

        </section>


        <!-- Product toevoegen -->
        <section class="add-product-section">

            <div class="section-header">

                <div>
                    <h2>Product toevoegen</h2>

                    <p>
                        Voeg een product toe aan een vak.
                    </p>
                </div>

            </div>


            <form id="productForm">

                <div class="form-group">

                    <label for="productName">
                        Product
                    </label>

                    <input
                        id="productName"
                        type="text"
                        placeholder="Bijvoorbeeld Coca Cola"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productSlot">
                        Vaknummer
                    </label>

                    <select
                        id="productSlot"
                        required
                    ></select>

                </div>


                <div class="form-group">

                    <label for="productDate">
                        Houdbaar tot
                    </label>

                    <input
                        id="productDate"
                        type="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productAmount">
                        Aantal
                    </label>

                    <input
                        id="productAmount"
                        type="number"
                        min="1"
                        value="1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    ＋ Product toevoegen
                </button>

            </form>

        </section>

    </main>


    <!-- Productdetails -->
    <div
        id="detailsModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Producten
                </h2>

                <button
                    id="closeModalButton"
                    class="close-button"
                    type="button"
                    aria-label="Sluiten"
                >
                    ✕
                </button>

            </div>


            <div
                id="modalProducts"
                class="modal-products"
            ></div>

        </div>

    </div>


    <!-- JavaScript uit dezelfde map -->
    <script src="./app.js"></script>


    <!-- PWA Service Worker uit dezelfde map -->
    <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./service-worker.js", {
                        scope: "./"
                    })
                    .then(registration => {

                        console.log(
                            "Service worker geladen:",
                            registration.scope
                        );

                    })
                    .catch(error => {

                        console.error(
                            "Service worker fout:",
                            error
                        );

                    });

            });

        }
    </script>

</body>
</html>
